---
all:
  children:
    routers:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ansible_playbook_python}}"

          # Required configuration parameters
          router_wan_interface: "enp1s0"
          router_lan_interface: "enp7s0"

          # Optional configuration parameters can be found here:
          # soho_router/defaults/main.yml

          router_hostname: "alma10-router"
          router_domain: "alma-testing.internal"

          router_lan_network: "192.168.30.1/24"

          # DNS4EU For Public - Protective Resolution
          dhcp_primary_dns: "86.54.11.1"
          dhcp_secondary_dns: "86.54.11.201"

          dhcp_client_pool_start: "192.168.30.100"
          dhcp_client_pool_end: "192.168.30.250"

          dhcp_client_reservations:
            - name: "alma10-client"
              mac: "52:54:00:b9:a1:71"
              ipv4: "192.168.30.70"
