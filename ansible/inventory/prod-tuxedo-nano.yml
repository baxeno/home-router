              mac: "e8:5c:5f:48:7a:db"
              ipv4: "192.168.82.51"
            # Multiroom streaming - Living room - Stereo speakers (LR, front)
            # WiFi: "90:56:82:83:07:37", Ethernet: "90:56:82:83:07:36"
            - name: "bluesound-power-node-n331"
              mac: "90:56:82:83:07:37"
              ipv4: "192.168.82.52"
            # Multiroom streaming - Living room - Left surround speaker (LS, back)
            # WiFi: "90:56:82:b0:a8:11", Ethernet: "90:56:82:b0:a8:10"
